[package]
name = "pm"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
nix = { version = "0.31.2", features = ["signal", "process"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38.4", features = ["system"] }
tokio = { version = "1.51.1", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
